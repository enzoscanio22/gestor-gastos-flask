{% extends "base.html" %}
{% block titulo %}Editar Gasto{% endblock %}
{% block contenido %}
    <div class="form-container">
        <form action="{{ url_for('editar_gasto', id_gasto = gasto[0]) }}" method="post">
            <label>Descripción:</label>
            <input type="text" name="descripcion" value="{{ descripcion}}" required>

            <label>Monto:</label>
            <input type="number" name="monto" value="{{ monto }}" required>

            <label>Categoría</label>
            <input type="text" name="categoria" value="{{ categoria }}" required>

            <label>Fecha</label>
            <input type="date" name="fecha" value="{{ fecha }}" required>

            <button type="submit">Guardar</button>

            {% if error %}
                <p class="aviso-error">{{ error }}</p>
            {% endif %}
        </form>

    </div>
{% endblock %}
