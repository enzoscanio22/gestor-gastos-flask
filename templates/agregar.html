{% extends "base.html" %}
{% block titulo %}Agregar Gasto{% endblock %}
{% block contenido %}
    <div class="form-container">
        <form action="/agregar" method="post">
            <label>Descripcion:</label>
            <input type="text" name="descripcion" value="{{ descripcion }}" placeholder="Ej. Uber" required>

            <label>Monto:</label>
            <input type="number" name="monto" value="{{ monto }}" placeholder="Ej. 2000" required>

            <label>Categoria:</label>
            <input type="text" name="categoria" value="{{ categoria }}" placeholder="Ej. Pedido a domicilio" required>

            <label>Fecha:</label>
            <input type="date" name="fecha" value="{{ fecha }}" placeholder="Ej. AAAA-MM-DD" required>

            <button type="submit">Guardar</button>

            {% if error %}
                <p class="aviso-error">{{ error }}</p>
            {% endif %}
        </form>

        <p><a href="{{ url_for('inicio') }}" class="btn-regresar">Volver al Inicio</a></p>

    </div>
    
{% endblock %}
